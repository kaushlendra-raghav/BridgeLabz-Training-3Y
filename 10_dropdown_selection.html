<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Preference Selection</title>
</head>
<body>
    <h1>Select Your Travel Preferences</h1>

    <form action="#" method="get">
        <p>
            <label for="country">Country:</label>
            <select id="country" name="country">
                <option value="India" selected>India</option>
                <option value="Nepal">Nepal</option>
                <option value="Japan">Japan</option>
            </select>
        </p>

        <p>
            <label for="state">State:</label>
            <select id="state" name="state">
                <option value="Uttar Pradesh" selected>Uttar Pradesh</option>
                <option value="Himachal Pradesh">Himachal Pradesh</option>
                <option value="Rajasthan">Rajasthan</option>
            </select>
        </p>

        <p>
            <label for="city">City:</label>
            <select id="city" name="city">
                <option value="Mathura" selected>Mathura</option>
                <option value="Manali">Manali</option>
                <option value="Jaipur">Jaipur</option>
            </select>
        </p>

        <p>
            <label for="place">Favorite Tourist Place:</label>
            <select id="place" name="favorite_place">
                <option value="Taj Mahal" selected>Taj Mahal</option>
                <option value="Hadimba Temple">Hadimba Temple</option>
                <option value="Hawa Mahal">Hawa Mahal</option>
            </select>
        </p>

        <p><button type="submit">Submit Choices</button></p>
    </form>

    <p><strong>Summary of sample choices:</strong> Country: India; State: Uttar Pradesh; City: Mathura; Favorite Tourist Place: Taj Mahal.</p>
</body>
</html>
